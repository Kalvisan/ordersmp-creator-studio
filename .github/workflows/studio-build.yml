name: Creator Studio
on:
  pull_request:
  push:
    branches: [feature/ordersmp-creator-studio, ordersmp, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: studio-${{ github.ref }}
  cancel-in-progress: true
jobs:
  security-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - uses: pnpm/action-setup@v4
        with:
          version: '10.6.1'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec jest --config apps/backend/jest.auth.config.cjs --runInBand
      - run: node --test studio/portal/*.test.mjs studio/publishing/*.test.mjs
      - run: python -m unittest discover -s studio/worker -p 'test_*.py' -v
      - run: git diff --check
  images:
    needs: security-tests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target: [postiz, gateway, worker, temporal]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: studio/deploy/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/kalvisan/ordersmp-creator-studio-${{ matrix.target }}:${{ github.sha }}
          cache-from: type=gha,scope=studio-${{ matrix.target }}
          cache-to: type=gha,scope=studio-${{ matrix.target }},mode=max
      - run: printf '%s\n' '${{ steps.build.outputs.digest }}' > image-digest.txt
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.target }}
          path: image-digest.txt
  smoke:
    needs: images
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: image-digests
      - name: Install isolated runtime probe
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nftables
      - name: Verify smoke teardown keeps protections on uncertain termination
        run: node --test studio/deploy/smoke.test.mjs
      - name: Start and verify the eight-service Linux stack
        run: node studio/deploy/smoke.mjs image-digests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: creator-smoke-report
          path: creator-smoke-report.json
          if-no-files-found: error
