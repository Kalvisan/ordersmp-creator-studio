worker_processes 1;
pid /tmp/nginx.pid;
error_log stderr warn;
events { worker_connections 256; }
http {
  include /etc/nginx/mime.types;
  server_tokens off;
  access_log off;
  client_body_temp_path /tmp/client;
  proxy_temp_path /tmp/proxy;
  client_header_timeout 15s;
  client_body_timeout 120s;
  send_timeout 120s;
  server {
    listen 10.64.64.1:8444 ssl;
    server_name studio.ordersmp.net;
    if ($host != studio.ordersmp.net) { return 444; }
    if ($ssl_server_name != studio.ordersmp.net) { return 421; }
    ssl_certificate /config/tls.crt;
    ssl_certificate_key /config/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    absolute_redirect off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    location = / { return 302 /creator/; }
    location ^~ /creator/internal/ { return 404; }
    location ^~ /creator/ {
      client_max_body_size 20g;
      proxy_request_buffering off;
      proxy_buffering off;
      proxy_read_timeout 120s;
      proxy_pass http://127.0.0.1:16080;
      proxy_set_header Host studio.ordersmp.net;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For "";
    }
    location /uploads/ { proxy_pass http://127.0.0.1:16080; }
    location /brand/ { proxy_pass http://127.0.0.1:16080; }
    location /api/uploads/ { return 403; }
    location / {
      proxy_pass http://127.0.0.1:4007;
      proxy_set_header Host studio.ordersmp.net;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For "";
      proxy_set_header Impersonate "";
    }
  }
}
