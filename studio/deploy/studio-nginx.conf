worker_processes 1;
pid /tmp/nginx.pid;
error_log stderr warn;
events { worker_connections 256; }
http {
  include /etc/nginx/mime.types;
  server_tokens off;
  access_log off;
  client_body_temp_path /tmp/client;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  client_header_timeout 15s;
  client_body_timeout 120s;
  send_timeout 120s;
  server {
    # The host's exact public vhost terminates TLS before this loopback hop.
    listen 127.0.0.1:8444;
    server_name studio.ordersmp.net;
    if ($host != studio.ordersmp.net) { return 444; }
    absolute_redirect off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    location = / { return 302 /creator/; }
    location ^~ /creator/internal/ { return 404; }
    location ^~ /creator/ {
      client_max_body_size 90m;
      proxy_request_buffering off;
      proxy_buffering off;
      proxy_read_timeout 120s;
      proxy_pass http://127.0.0.1:16080;
      proxy_set_header Host studio.ordersmp.net;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For "";
    }
    location /uploads/ { proxy_pass http://127.0.0.1:16080; }
    location /brand/ { proxy_pass http://127.0.0.1:16080; }
    location /api/uploads/ { return 403; }
    location / {
      proxy_pass http://127.0.0.1:4007;
      proxy_set_header Host studio.ordersmp.net;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For "";
      proxy_set_header Impersonate "";
    }
  }
}
