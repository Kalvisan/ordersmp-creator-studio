worker_processes 1;
pid /tmp/nginx/nginx.pid;
error_log stderr warn;
events { worker_connections 256; }
http {
  include /etc/nginx/mime.types;
  access_log off;
  server_tokens off;
  client_body_temp_path /tmp/nginx/client;
  proxy_temp_path /tmp/nginx/proxy;
  fastcgi_temp_path /tmp/nginx/fastcgi;
  uwsgi_temp_path /tmp/nginx/uwsgi;
  scgi_temp_path /tmp/nginx/scgi;
  client_max_body_size 256m;
  server {
    listen 127.0.0.1:4007;
    server_name studio.ordersmp.net;
    absolute_redirect off;
    location /api/ {
      proxy_pass http://127.0.0.1:3000/;
      proxy_set_header Host studio.ordersmp.net;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For "";
      proxy_set_header Impersonate "";
    }
    # Private uploads pass through the gateway's owner check.
    location /uploads/ { return 403; }
    location /api/uploads/ { return 403; }
    location / {
      proxy_pass http://127.0.0.1:4200;
      proxy_set_header Host studio.ordersmp.net;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Impersonate "";
    }
  }
}
